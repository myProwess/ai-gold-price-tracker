<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Lakshmi PriceMart">
    <title>Live Gold Rates Dashboard | Lakshmi PriceMart</title>
    <meta name="description" content="View live, interactive gold prices for various purities (24K, 22K, 18K) and weights in India. Updated in real-time.">
    <meta name="keywords" content="gold rates, live gold price, 24K gold, 22K gold, 18K gold, gold price today, Lakshmi PriceMart">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://example.com/gold">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/gold">
    <meta property="og:title" content="Live Gold Rates Dashboard | Lakshmi PriceMart">
    <meta property="og:description" content="View live, interactive gold prices for various purities (24K, 22K, 18K) and weights.">
    <meta property="og:image" content="https://example.com/assets/gold-og.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://example.com/gold">
    <meta name="twitter:title" content="Live Gold Rates Dashboard | Lakshmi PriceMart">
    <meta name="twitter:description" content="View live, interactive gold prices for various purities (24K, 22K, 18K) and weights.">
    <meta name="twitter:image" content="https://example.com/assets/gold-og.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lakshmi PriceMart Gold Rates",
      "url": "https://example.com/gold",
      "description": "Live gold pricing dashboard."
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "How often are the gold prices updated?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Gold prices are updated in real-time multiple times a day based on local market fluctuations."
        }
      }, {
        "@type": "Question",
        "name": "What purities of gold are tracked?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We track 24K pure gold, 22K standard gold, and 18K gold."
        }
      }]
    }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="static/css/styles.css">
</head>

<body class="gold-theme antialiased selection:bg-yellow-200/50">

    <div
        class="fixed inset-0 z-[-1] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-yellow-300/30 via-transparent to-transparent pointer-events-none">
    </div>

    <nav class="w-full glass-panel border-b border-t-0 border-x-0 !rounded-none z-10 sticky top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between h-auto sm:h-20 py-4 sm:py-0 relative w-full gap-4">
                <div class="flex items-center gap-2 md:gap-3 z-10 shrink-0">
                    <div
                        class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500 flex items-center justify-center shadow-[0_0_15px_rgba(250,204,21,0.3)]">
                        <!-- Indian Rupee Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 md:h-6 md:w-6 text-yellow-900" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 8h6m-5 0a3 3 0 110 6H9l3 3m-3-6h6m6 1a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h1
                        class="text-lg md:text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-yellow-600 to-yellow-800">
                        Lakshmi<span class="font-light text-slate-600 hidden sm:inline">PriceMart</span><span class="font-light text-slate-600 sm:hidden">PM</span>
                    </h1>
                </div>
                <!-- Navigation links (Centered on all mobile/desktop) -->
                <div
                    class="flex items-center justify-center space-x-8 sm:space-x-12 md:space-x-24 z-10 sm:absolute sm:inset-0 pointer-events-none mt-1 sm:mt-2">
                    <a href="index.html"
                        class="nav-link active font-extrabold text-2xl sm:text-3xl md:text-4xl text-yellow-700 tracking-wider px-4 sm:px-12 pointer-events-auto transition-transform hover:scale-105 inline-block">Gold</a>
                    <a href="silver.html"
                        class="nav-link font-extrabold text-2xl sm:text-3xl md:text-4xl text-slate-500 hover:text-slate-800 tracking-wider px-4 sm:px-12 pointer-events-auto transition-transform hover:scale-105 inline-block">Silver</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <!-- Breadcrumb Navigation -->
        <nav class="flex mb-6 text-sm text-slate-500" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1 md:space-x-3">
                <li class="inline-flex items-center">
                    <a href="index.html" class="inline-flex items-center hover:text-yellow-600 transition-colors">
                        <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                        Home
                    </a>
                </li>
                <li>
                    <div class="flex items-center">
                        <svg class="w-6 h-6 text-slate-400" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                        <span class="ml-1 text-slate-700 font-medium md:ml-2">Live Gold Rates</span>
                    </div>
                </li>
            </ol>
        </nav>

        <!-- New Location and Specialized Updating Header -->
        <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <div class="flex items-center gap-2 mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-yellow-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span id="location-header"
                        class="text-lg font-bold text-yellow-700 uppercase tracking-widest bg-yellow-100 px-3 py-1 rounded-full shadow-sm">
                        Loading...
                    </span>
                </div>
                <h2 class="text-4xl font-bold mb-2 animate-value text-slate-800">Live Gold Rates</h2>
                <div class="text-slate-500 text-sm md:text-base flex items-center gap-2 mt-4">
                    <div class="relative flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
                    </div>
                    <span>Pricing live as of:</span>
                    <span id="last-updated" class="font-bold text-slate-700">...</span>
                </div>
            </div>

            <div class="flex items-center gap-3 self-start md:self-auto shrink-0 whitespace-nowrap relative">
                <button id="sync-data-btn"
                    class="text-white font-bold bg-indigo-600 hover:bg-indigo-700 transition-colors px-4 py-2 rounded-lg shadow-md flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Update Data
                </button>
                <span id="sync-status" class="absolute -bottom-6 right-0 text-xs font-medium"></span>
            </div>
        </header>

        <div class="flex flex-col gap-8 w-full">
            <!-- Summary Header Card -->
            <div
                class="glass-panel w-full rounded-3xl p-6 md:p-8 flex flex-col justify-between relative overflow-hidden group">
                <div
                    class="absolute -right-24 -top-24 w-96 h-96 bg-yellow-400/10 rounded-full blur-3xl group-hover:bg-yellow-400/20 transition-all duration-700">
                </div>

                <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2 relative z-10 w-full">
                    <span class="w-3 h-3 rounded-full bg-yellow-500 animate-pulse"></span>
                    Today's Rate Summary (Per Gram)
                </h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 relative z-10 w-full" id="gold-summary-cards">
                    <!-- 24K, 22K, 18K 1g summary injected here -->
                    <div class="skeleton h-32 w-full rounded-2xl"></div>
                    <div class="skeleton h-32 w-full rounded-2xl"></div>
                    <div class="skeleton h-32 w-full rounded-2xl"></div>
                </div>
            </div>

            <!-- Price Trends Chart Container -->
            <div class="glass-panel w-full rounded-3xl p-6 md:p-8 relative overflow-hidden group">
                <div
                    class="absolute -left-24 -bottom-24 w-96 h-96 bg-indigo-400/10 rounded-full blur-3xl group-hover:bg-indigo-400/20 transition-all duration-700">
                </div>

                <h3 class="text-xl font-bold mb-6 text-slate-800 flex items-center gap-2 relative z-10 w-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-500" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
                    </svg>
                    7-Day Price Trends (24K Gold)
                </h3>

                <div class="relative w-full h-[300px] z-10">
                    <canvas id="goldPriceChart"></canvas>
                </div>
            </div>

            <!-- Full Tables Container (Grid modified for responsive horizontal scaling) -->
            <div class="glass-panel w-full rounded-3xl p-4 md:p-6 relative overflow-hidden">
                <h3 class="text-xl font-bold mb-4 text-slate-800 relative z-10">Comprehensive Pricing (All Weights)</h3>

                <div id="gold-tables-container"
                    class="grid grid-cols-1 xl:grid-cols-3 gap-4 relative z-10 w-full min-w-0">
                    <!-- Tables injected here -->
                    <div class="skeleton h-64 w-full rounded-2xl"></div>
                    <div class="skeleton h-64 w-full rounded-2xl"></div>
                    <div class="skeleton h-64 w-full rounded-2xl"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="static/js/main.js"></script>
</body>

</html>
